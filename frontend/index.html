<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/jpeg" href="/geu-tab-logo.jpg" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Quest 2026 • Graphic Era University</title>
    <meta name="description" content="AI Quest 2026 - Northern India's Premier Technology and AI Championship by Graphic Era University." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Outfit:wght@100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        'use strict';
        try {
          var docProto = Document.prototype;
          var origHiddenDesc = Object.getOwnPropertyDescriptor(docProto, 'hidden');
          var origVisDesc = Object.getOwnPropertyDescriptor(docProto, 'visibilityState');
          var origHasFocus = docProto.hasFocus;
          var origAddEventListener = EventTarget.prototype.addEventListener;
          var origRemoveEventListener = EventTarget.prototype.removeEventListener;

          window.__NATIVE_SHIELD__ = {
            hiddenGetter: (origHiddenDesc && origHiddenDesc.get) ? origHiddenDesc.get : null,
            visGetter: (origVisDesc && origVisDesc.get) ? origVisDesc.get : null,
            hasFocus: origHasFocus,
            addEventListener: origAddEventListener,
            removeEventListener: origRemoveEventListener
          };

          try {
            if (origHiddenDesc && origHiddenDesc.get) {
              Object.defineProperty(docProto, 'hidden', {
                get: origHiddenDesc.get,
                set: undefined,
                configurable: false,
                enumerable: origHiddenDesc.enumerable
              });
            }
            if (origVisDesc && origVisDesc.get) {
              Object.defineProperty(docProto, 'visibilityState', {
                get: origVisDesc.get,
                set: undefined,
                configurable: false,
                enumerable: origVisDesc.enumerable
              });
            }
          } catch (_) {}

          function blockEvent(e) {
            if (e.type === 'contextmenu' || e.button === 2 || e.which === 3 || (e.ctrlKey && e.button === 0)) {
              var path = (window.location && window.location.pathname) || '';
              var isExam = path.includes('/take') || path.includes('/quiz') || window.__QUIZX_LOCKDOWN__ || (document.body && document.body.classList && document.body.classList.contains('quizx-exam-lockdown'));
              if (isExam) {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                return false;
              }
            }
          }
          ['contextmenu', 'mousedown', 'mouseup', 'pointerdown', 'pointerup', 'auxclick'].forEach(function(evt) {
            origAddEventListener.call(window, evt, blockEvent, true);
            origAddEventListener.call(document, evt, blockEvent, true);
          });

          function blockKeys(e) {
            var path = (window.location && window.location.pathname) || '';
            var isExam = path.includes('/take') || path.includes('/quiz') || window.__QUIZX_LOCKDOWN__ || (document.body && document.body.classList && document.body.classList.contains('quizx-exam-lockdown'));
            if (!isExam) return;

            var isWin = e.key === 'Meta' || e.key === 'OS' || e.key === 'Win' || e.code === 'MetaLeft' || e.code === 'MetaRight' || e.keyCode === 91 || e.keyCode === 92 || e.keyCode === 224 || e.metaKey;
            if (isWin) {
              e.preventDefault();
              e.stopPropagation();
              e.stopImmediatePropagation();
              return false;
            }
          }
          ['keydown', 'keyup'].forEach(function(evt) {
            origAddEventListener.call(window, evt, blockKeys, true);
            origAddEventListener.call(document, evt, blockKeys, true);
          });
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-indigo-100 selection:text-indigo-900">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
