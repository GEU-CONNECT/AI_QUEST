name: Deploy AI Quest Platform

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-ai-quest-module
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy AI Quest
    runs-on: [self-hosted, aiquest]

    steps:
      - name: Deploy Live on Server with Resource Protection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "=========================================="
          echo "🚀 [CI/CD] Deploying AI Quest 2026 (Throttled & Safe)..."
          echo "=========================================="

          # 1. Acquire global build lock so parallel pushes queue safely
          exec 200>/var/lock/ec2_build.lock
          flock -x 200

          # 2. Preserve environment variables and database safely with timestamped history
          mkdir -p /home/ubuntu/.env_backups /home/ubuntu/.db_backups /home/ubuntu/.db_backups_history /home/ubuntu/.db_backups_temp_protect
          TS=$(date +%Y%m%d_%H%M%S)

          [ -f /home/ubuntu/AI_QUEST/backend/.env ] && cp -f /home/ubuntu/AI_QUEST/backend/.env /home/ubuntu/.env_backups/aiquest_backend_env_backup 2>/dev/null || true

          # Preserve current live database state before git touches anything
          if [ -f /home/ubuntu/AI_QUEST/backend/prisma/dev.db ]; then
            cp -a /home/ubuntu/AI_QUEST/backend/prisma/dev.db* /home/ubuntu/.db_backups_temp_protect/ 2>/dev/null || true
            mkdir -p /home/ubuntu/.db_backups_history/$TS
            cp -a /home/ubuntu/AI_QUEST/backend/prisma/dev.db* /home/ubuntu/.db_backups_history/$TS/ 2>/dev/null || true
          fi

          # 3. Update live repo
          cd /home/ubuntu/AI_QUEST
          if [ -n "$GITHUB_TOKEN" ]; then
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/GEU-CONNECT/AI_QUEST.git"
          fi
          git fetch origin main
          git reset --hard origin/main

          # Restore .env and ensure dev.db is in place
          [ ! -f /home/ubuntu/AI_QUEST/backend/.env ] && [ -f /home/ubuntu/.env_backups/aiquest_backend_env_backup ] && cp -f /home/ubuntu/.env_backups/aiquest_backend_env_backup /home/ubuntu/AI_QUEST/backend/.env || true
          mkdir -p /home/ubuntu/AI_QUEST/backend/prisma
          if [ -f /home/ubuntu/.db_backups_temp_protect/dev.db ]; then
            cp -a /home/ubuntu/.db_backups_temp_protect/dev.db* /home/ubuntu/AI_QUEST/backend/prisma/ 2>/dev/null || true
          elif [ -f /home/ubuntu/.db_backups/aiquest_dev_db_backup ]; then
            cp -f /home/ubuntu/.db_backups/aiquest_dev_db_backup /home/ubuntu/AI_QUEST/backend/prisma/dev.db 2>/dev/null || true
          fi

          # 4. Setup Database & Backend
          echo "⚙️ Setting up AI Quest Backend (Port 5005)..."
          cd /home/ubuntu/AI_QUEST/backend
          if [ ! -d "node_modules" ] || [ package.json -nt node_modules ]; then
            echo "📦 Installing backend dependencies..."
            nice -n 19 npm install --legacy-peer-deps --prefer-offline --no-audit --no-fund --silent
            touch node_modules
          else
            echo "⚡ Backend dependencies up to date, skipping npm install."
          fi
          nice -n 19 npx prisma generate

          # 5. Run Candidate Recovery & Protection Script
          echo "🔍 Running Candidate Recovery across all backups, logs, and carvings..."
          nice -n 19 node scripts/recover-students.js || true

          # Restart backend process
          pm2 reload aiquest-backend || pm2 restart aiquest-backend || pm2 start ecosystem.config.js
          pm2 save

          # 6. Single-pass Frontend build with lowest CPU priority and memory capped
          echo "🎨 Building AI Quest Frontend (Throttled)..."
          cd /home/ubuntu/AI_QUEST/frontend
          if [ ! -d "node_modules" ] || [ package.json -nt node_modules ]; then
            echo "📦 Installing frontend dependencies..."
            nice -n 19 npm install --legacy-peer-deps --prefer-offline --no-audit --no-fund --silent
            touch node_modules
          else
            echo "⚡ Frontend dependencies up to date, skipping npm install."
          fi
          nice -n 19 ionice -c 3 env UV_THREADPOOL_SIZE=2 NODE_OPTIONS="--max-old-space-size=1536" npm run build

          # 7. Sync to Web Root
          sudo mkdir -p /var/www/aiquest/current
          sudo cp -rf dist/* /var/www/aiquest/current/
          [ -f /home/ubuntu/AI_QUEST/backend/recovery-report.json ] && sudo cp -f /home/ubuntu/AI_QUEST/backend/recovery-report.json /var/www/aiquest/current/ 2>/dev/null || true
          sudo chown -R www-data:www-data /var/www/aiquest

          # 8. Verify and reload Nginx
          sudo nginx -t && sudo systemctl reload nginx || true

          echo "=========================================="
          echo "✅ [CI/CD] AI Quest 2026 Deployed Safely!"
          echo "🌐 Live on: https://aiquest.pblgeu.online"
          echo "=========================================="
